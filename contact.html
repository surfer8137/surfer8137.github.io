<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Contacto</title>

  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <h1>Contacto</h1>
  <hr>
  <hr>
  <h2>Redes sociales</h2>
  <div class="row">
    <div class="col-lg-12 text-center">
      <a href="https://www.linkedin.com/in/%C3%A1ngel-s%C3%A1nchez-garc%C3%ADa-05a976105/">
      <img class="img" src="img/linkedin.jpg" alt="Generic placeholder image" width="140" height="140">
      <h3>Linkedin</h3>
      </a>
    </div>
  </div>
  <hr>
  <h2>E-Mail</h2>
  <hr>
  <form action="mailto:asangar96@gmail.com" method="post" enctype="text/plain">
    <div class="form-group row">
      <div class="col-xs-3"></div>
      <label for="example-text-input" class="col-xs-2 col-form-label">Nombre</label>
      <div class="col-xs-4">
        <input class="form-control" type="text" value="" placeholder="Introduce tu nombre" id="email">
      </div>
      <div class="col-xs-3"></div>
    </div>
    <div class="form-group row">
      <div class="col-xs-3"></div>
      <label for="example-text-input" class="col-xs-2 col-form-label">Asunto</label>
      <div class="col-xs-4">
        <input class="form-control" type="text" value="" placeholder="Introduce el asunto" id="email">
      </div>
      <div class="col-xs-3"></div>
    </div>
    <div class="form-group row">
      <div class="col-xs-3"></div>
      <label for="example-text-input" class="col-xs-2 col-form-label">Mensaje</label>
      <div class="col-xs-4">
        <textarea name="name" class="form-control" placeholder="Introduce el texto a enviar" rows="8" cols="80"></textarea>
      </div>
      <div class="col-xs-3"></div>
    </div>
    <br>
    <div class="form-group row">
      <div class="col-xs-12 text-center">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </div>
  </form>
  <hr>
  <footer>
    <hr>
  </footer>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
