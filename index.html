<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Index</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div id="index" class="index-depth">
    <div id="jumbotron" class="jumbotron">
      <div id="jumbotron-background" class="bg-overlay animated">
        <div id="welcome" class="container">
          <a class="btn btn-lg" id="explore"><h1>Welcome to my portfolio!</h1></a>
        </div>
      </div>
    </div>
  </div>
  <div id="elements" class="elements-depth" style="width:100%;height:100%;">

    <ul class="nav nav-tabs nav-justified">
      <li role="presentation" class="active" id="about" onclick="showhtml('about')"><a>Home (About)</a></li>
      <li role="presentation" id="projects"  onclick="showhtml('projects')"><a>Projects</a></li>
      <li role="presentation" id="experience"><a>Experience</a></li>
      <li role="presentation" id="knowledge"><a onclick="showhtml('knowledge')">Knowledge</a></li>
      <li role="presentation" id="contact"><a>Contact</a></li>
    </ul>

    <div id="content">

    </div>

  </div>
  <footer>
  </footer>
  <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <!-- Include all compiled plugins (below), or include individual files as needed -->
  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    function showhtml(site) {
      if (site === "knowledge") {
        setActiveTab("knowledge");
        $("#content").load('knowledge.html');
      } else if (site === "about") {
        setActiveTab("about");
        $("#content").load('about.html');
        setTimeout(function() {
          $('#me').width($('#meCol').width() * 0.5);
        }, 1000);
      } else if (site === "projects") {
        setActiveTab("projects");
        $("#content").load('projects.html');
      } else {
        $("#content").html('asd');
      }
    }

    adjustHeightElementToWindow = function(elementId) {
      var element = document.getElementById(elementId);
      if (element != null)
        element.style.height = window.innerHeight + "px";
    }

    resetActiveTabs = function() {
      $("#about").removeClass();
      $("#projects").removeClass();
      $("#experience").removeClass();
      $("#knowledge").removeClass();
      $("#contact").removeClass();
    }

    setActiveTab = function(tabName) {
      resetActiveTabs();
      var tab = $('#' + tabName);
      tab.addClass("active");
    }

    window.onresize = function(event) {
      if (document.readyState === "complete") {
        adjustHeightElementToWindow('jumbotron');
        adjustHeightElementToWindow('jumbotron-background');
        adjustHeightElementToWindow('elements');
        setTimeout(function() {
          $('#me').width($('#meCol').width() * 0.5);
        }, 500);
      }
    };

    adjustHeightElementToWindow('jumbotron');
    adjustHeightElementToWindow('jumbotron-background');
    adjustHeightElementToWindow('elements');


    $("#elements").hide();
    $("#explore").click(
      function() {
        $("#welcome").animate({
          'zoom': 3
        }, 1800);
        $("#index").animate({
          'zoom': 0
        }, 2000);
        $("#elements").show();
        setTimeout(function() {
          $("#index").remove();
        }, 1900);
        $("#explore").remove();
      }
    );

    showhtml('about');
  </script>
</body>

</html>
