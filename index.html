    <head>
        <title>Portafolio</title>
        <meta charset="UTF-8">

        <link rel="shortcut icon" href="/favicon.ico" />
        <link href="css/bootstrap.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">

    <body> 
        <nav class="navbar navbar-inverse navbar-static-top">
            <div class="container">
                <!--
                <a class="pull-left navbar-brand mainButton" href="#">Main</a> 
                <ul class="nav navbar-nav navbar-right">

                </ul>

            </div>

        <div class="row">  
            <a href="games.html"><img  src="images/games.png" id="imageGame" class="img-responsive img-thumbnail  col-sm-6" onmouseover="imageTextGame('images/gamesText.png')"  onmouseout="imageTextGame('images/games.png')" alt=".."> </a>
            <a href=""> <img  src="images/plants.png" id="imagePlant" class="img-responsive img-thumbnail  col-sm-6" onmouseover="imageTextPlant('images/plantText.png')"  onmouseout="imageTextPlant('images/plants.png')"  alt="Responsive image"> </a>
        </div> 
        <div class="row">      
            <img  src="images/games.png" id="imageContact" class="img-responsive img-thumbnail  col-sm-6" onmouseover="imageTextContact('images/aboutText.png')"  onmouseout="imageTextContact('images/games.png')"  alt="Responsive image">                      
            <img  src="images/games.png" id="imageAbout" class="img-responsive img-thumbnail  col-sm-6" onmouseover="imageTextAbout('images/contactText.png')"  onmouseout="imageTextAbout('images/games.png')"  alt="Responsive image">

        <script>


                function imageTextGame(newImage) {
                    document.getElementById("imageGame").src = newImage;
                }

                function imageTextPlant(newImage) {
                    document.getElementById("imagePlant").src = newImage;
                }

                function imageTextContact(newImage) {
                    document.getElementById("imageContact").src = newImage;
                }

                function imageTextAbout(newImage) {
                    document.getElementById("imageAbout").src = newImage;
                }





        </script>
